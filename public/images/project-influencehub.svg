<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">InfluenceHub website preview</title>
  <desc id="description">A bright influencer marketplace landing page with creator cards and campaign analytics.</desc>
  <defs>
    <linearGradient id="background" x1="90" y1="90" x2="1500" y2="930" gradientUnits="userSpaceOnUse">
