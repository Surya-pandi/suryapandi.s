    <circle cx="112" cy="82" r="39" fill="#fff" fill-opacity=".58"/>
    <path d="M57 170c15-40 47-63 55-63s40 23 55 63" fill="#327fbd" opacity=".78"/>
    <circle cx="190" cy="31" r="14" fill="#fff"/>
