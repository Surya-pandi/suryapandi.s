  <text x="176" y="105" fill="#111327" font-family="Arial, sans-serif" font-size="31" font-weight="800">Influence</text>
  <text x="324" y="105" fill="#ff2d9a" font-family="Arial, sans-serif" font-size="31" font-weight="800">Hub</text>
