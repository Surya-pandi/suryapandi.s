    <linearGradient id="portraitOne" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffd9eb"/>
      <stop offset="1" stop-color="#ffa8d0"/>
    </linearGradient>
    <linearGradient id="portraitTwo" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d8f6ff"/>
      <stop offset="1" stop-color="#8bdcff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
